server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Same-origin API access (environment.ts -> apiBaseUrl: '/api') — proxied to the backend
    # container over the compose network, so the browser never needs to know the backend's port.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Angular client-side routing — unmatched paths fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
