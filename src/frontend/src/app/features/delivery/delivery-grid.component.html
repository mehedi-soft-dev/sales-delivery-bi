<p-table
  class="delivery-grid"
  [value]="page().items"
  [lazy]="true"
  (onLazyLoad)="lazyLoad.emit($event)"
  [paginator]="true"
  [rows]="page().pageSize"
  [first]="(page().page - 1) * page().pageSize"
  [totalRecords]="page().totalCount"
  [loading]="loading()"
  [sortField]="sortField()"
  [sortOrder]="sortOrder()"
  [rowsPerPageOptions]="[10, 20, 50]"
  [showCurrentPageReport]="true"
  currentPageReportTemplate="Showing {first} to {last} of {totalRecords} results"
  dataKey="deliveryId"
  responsiveLayout="scroll"
>
  <ng-template #header>
    <tr>
      <th pSortableColumn="challanNo">Challan No. <p-sortIcon field="challanNo" /></th>
      <th pSortableColumn="soNo" class="delivery-grid__col--low-priority">Order No. <p-sortIcon field="soNo" /></th>
      <th pSortableColumn="buyerName">Buyer <p-sortIcon field="buyerName" /></th>
      <th pSortableColumn="unitName" class="delivery-grid__col--low-priority">Unit <p-sortIcon field="unitName" /></th>
      <th pSortableColumn="deliveryStatus">Status <p-sortIcon field="deliveryStatus" /></th>
      <th pSortableColumn="delayDays" class="delivery-grid__col--right">Delay (days) <p-sortIcon field="delayDays" /></th>
      <th pSortableColumn="deliveredValueUsd" class="delivery-grid__col--right">
        Delivered Value <p-sortIcon field="deliveredValueUsd" />
      </th>
    </tr>
  </ng-template>

  <ng-template #body let-row>
    <tr [ngClass]="rowLateClass(row.deliveryStatus)">
      <td>{{ row.challanNo }}</td>
      <td class="delivery-grid__col--low-priority">{{ row.soNo }}</td>
      <td>{{ row.buyerName }}</td>
      <td class="delivery-grid__col--low-priority">{{ row.unitName }}</td>
      <td>{{ row.deliveryStatus }}</td>
      <td class="delivery-grid__col--right">{{ row.delayDays }}</td>
      <td class="delivery-grid__col--right">{{ row.deliveredValueUsd | currencyUsd }}</td>
    </tr>
  </ng-template>

  <ng-template #emptymessage>
    <tr>
      <td colspan="7" class="delivery-grid__empty">No deliveries match this filter.</td>
    </tr>
  </ng-template>
</p-table>
