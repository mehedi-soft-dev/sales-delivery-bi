<div class="win-loss-chart">
  <apx-chart
    [chart]="chart"
    [series]="series()"
    [xaxis]="xaxis"
    [yaxis]="yaxis"
    [colors]="colors"
    [plotOptions]="plotOptions"
    [legend]="legend"
    [grid]="grid"
    [tooltip]="tooltip"
    [dataLabels]="dataLabels"
    [responsive]="responsive"
  />

  <div class="win-loss-chart__legend">
    @for (item of legendItems; track item.label) {
      <span class="win-loss-chart__legend-item">
        <span class="win-loss-chart__legend-swatch" [style.background-color]="item.color"></span>
        {{ item.label }}
      </span>
    }
  </div>
</div>
