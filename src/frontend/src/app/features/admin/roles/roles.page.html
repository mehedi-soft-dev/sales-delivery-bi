<div class="roles-page">
  <app-page-header title="Roles" subtitle="Seeded roles and the permission codes each one grants." icon="sitemap" />

  @if (service.error()) {
    <div class="dashboard-state dashboard-state--error" role="alert">Something went wrong loading roles. Please try again.</div>
  } @else {
    <div class="dashboard-card dashboard-card--table">
      <p-table
        [value]="service.page()?.items ?? []"
        [lazy]="true"
        (onLazyLoad)="onLazyLoad($event)"
        [paginator]="true"
        [rows]="service.page()?.pageSize ?? 10"
        [first]="((service.page()?.page ?? 1) - 1) * (service.page()?.pageSize ?? 10)"
        [totalRecords]="service.page()?.totalCount ?? 0"
        [loading]="service.loading()"
        [rowsPerPageOptions]="[10, 20, 50]"
        [showCurrentPageReport]="true"
        currentPageReportTemplate="Showing {first} to {last} of {totalRecords} results"
        dataKey="roleId"
        responsiveLayout="scroll"
      >
        <ng-template #header>
          <tr>
            <th pSortableColumn="roleName">Role <p-sortIcon field="roleName" /></th>
            <th pSortableColumn="userCount" class="roles-page__col--right">Users <p-sortIcon field="userCount" /></th>
            <th>Permissions</th>
            @if (canManagePermissions) {
              <th class="roles-page__col--right">Actions</th>
            }
          </tr>
        </ng-template>
        <ng-template #body let-row>
          <tr>
            <td>{{ row.roleName }}</td>
            <td class="roles-page__col--right">{{ row.userCount }}</td>
            <td>
              <div class="roles-page__codes">
                @for (code of row.permissionCodes; track code) {
                  <span class="roles-page__code">{{ code }}</span>
                }
              </div>
            </td>
            @if (canManagePermissions) {
              <td class="roles-page__col--right">
                <p-button label="Edit" size="small" severity="secondary" [text]="true" (onClick)="onEditPermissions(row)" />
              </td>
            }
          </tr>
        </ng-template>
        <ng-template #emptymessage>
          <tr>
            <td [attr.colspan]="canManagePermissions ? 4 : 3" class="roles-page__empty">No roles found.</td>
          </tr>
        </ng-template>
      </p-table>
    </div>
  }
</div>

<app-role-permissions-dialog
  [role]="editingRole()"
  [visible]="dialogVisible()"
  (visibleChange)="dialogVisible.set($event)"
  (saved)="onDialogSaved()"
/>
