<div class="aging-page">
  <app-page-header title="Aging" subtitle="Open quotations by age, with high-risk exposure surfaced first" icon="clock">
    <app-include-draft-toggle [(checked)]="includeDraft" />
    <app-data-as-of [lastRefresh]="service.lastRefresh()" (refresh)="onRefresh()" />
  </app-page-header>

  @if (service.loading() && !service.data()) {
    <app-loading-skeleton [kpiCount]="2" [contentBlockHeights]="[300, 360]" />
  } @else if (service.error()) {
    <div class="dashboard-state dashboard-state--error" role="alert">
      Something went wrong loading the aging dashboard. Please try again.
    </div>
  } @else if (service.data(); as aging) {
    <div class="dashboard-kpis">
      <app-kpi-card label="Total Open Value" [value]="aging.kpis.totalOpenValueUsd | currencyUsd" icon="wallet" accent="blue" />
      <app-kpi-card
        label="High-Risk Aged Value"
        [value]="aging.kpis.highRiskAgedValueUsd | currencyUsd"
        icon="exclamation-triangle"
        accent="red"
      />
    </div>

    <div class="dashboard-card">
      <h2>Aging Buckets — Value &amp; Quotation Count</h2>
      <app-aging-bucket-chart [buckets]="aging.agingBuckets" />
    </div>

    <div class="dashboard-card__header">
      <h2>Aged Quotations</h2>
      <span class="dashboard-card__count-badge">{{ aging.agedQuotations.totalCount }} Records</span>
    </div>
    <div class="dashboard-card dashboard-card--table">
      <app-aging-grid [page]="aging.agedQuotations" [loading]="service.loading()" (lazyLoad)="onLazyLoad($event)" />
    </div>
  }
</div>
