services:
  postgres:
    build:
      context: ./docker/postgres
    container_name: bi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: salesdeliverybi
      POSTGRES_USER: salesdeliverybi
      POSTGRES_PASSWORD: salesdeliverybi
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_cron
      - -c
      - cron.database_name=salesdeliverybi
    ports:
      - "127.0.0.1:5444:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salesdeliverybi -d salesdeliverybi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bi-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6391:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./src/backend
    container_name: bi-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__SalesDeliveryBi: "Host=postgres;Port=5432;Database=salesdeliverybi;Username=salesdeliverybi;Password=salesdeliverybi;SSL Mode=Disable"
      ConnectionStrings__Redis: "redis:6379"
      Jwt__Issuer: "https://localhost/identity"
      Jwt__Audience: "salesdeliverybi"
      Jwt__SigningKey: "docker-dev-signing-key-replace-once-the-identity-service-exists-0123456789"
    ports:
      - "127.0.0.1:58080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./src/frontend
    container_name: bi-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:58090:80"

volumes:
  postgres-data:
  redis-data:
